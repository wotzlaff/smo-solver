name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo test -p svm-smo --release
      - run: cargo test -p svm-smo --release --no-default-features
      - name: Check wasm32 builds (core crate and demo module without JS imports)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p svm-smo --release --no-default-features --target wasm32-unknown-unknown
          cargo build -p svm-smo-wasm --profile wasm --target wasm32-unknown-unknown
          node -e "const b=require('fs').readFileSync('target/wasm32-unknown-unknown/wasm/svm_smo_wasm.wasm'); const i=WebAssembly.Module.imports(new WebAssembly.Module(b)); if(i.length) throw new Error('unexpected imports: '+JSON.stringify(i))"

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run ruff check python tests
      - run: uv run pytest -q
