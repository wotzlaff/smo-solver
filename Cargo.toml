[workspace]
resolver = "2"
members = ["crates/svm-smo", "crates/svm-smo-py", "crates/svm-smo-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Nico Strasdat <nstrasdat@gmail.com>"]
license = "BSD-3-Clause"
repository = "https://github.com/wotzlaff/svm-smo"

[profile.release]
lto = "thin"
codegen-units = 1

# small binary for the browser demo: cargo build --profile wasm -p svm-smo-wasm --target wasm32-unknown-unknown
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
strip = true
panic = "abort"
